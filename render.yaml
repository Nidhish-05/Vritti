# render.yaml — Render Blueprint for Vritti (master-cloud)
# Defines two services:
#   1. vritti-api      — FastAPI Web Service (always on, serves the dashboard)
#   2. vritti-scheduler — Background Worker (triggered manually or via cron)
#
# Deploy: connect this repo on render.com → New → Blueprint → select master-cloud

services:

  # ── FastAPI REST API ────────────────────────────────────────────────────────
  - type: web
    name: vritti-api
    runtime: python
    branch: master-cloud
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    plan: free

    envVars:
      - key: ASYNC_DATABASE_URL
        sync: false          # Set this manually in Render dashboard (Neon connection string)
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL, e.g. https://vritti.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Scheduler — Single-Run Background Worker ────────────────────────────────
  # Render free tier does not support scheduled cron jobs.
  # Run this manually from the Render dashboard, or trigger via a free external
  # cron service (e.g. cron-job.org hitting the /health endpoint to wake the API,
  # then SSH/manual trigger).
  #
  # NOTE: FinBERT (~1.5GB RAM) exceeds Render's 512MB free limit.
  # Classification runs locally (on your machine) via:
  #   python -m src.ingestion.scheduler
  # with ASYNC_DATABASE_URL pointing to Neon. See README for the local → cloud workflow.
  - type: worker
    name: vritti-scheduler
    runtime: python
    branch: master-cloud
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m src.ingestion.scheduler"
    plan: free

    envVars:
      - key: ASYNC_DATABASE_URL
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
