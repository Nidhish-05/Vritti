services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16

    container_name: vritti-timescaledb

    environment:
      POSTGRES_DB: vritti_db
      POSTGRES_USER: vritti
      POSTGRES_PASSWORD: vritti_password

    ports:
      - "5432:5432"

    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vritti -d vritti_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=timescaledb
      - ASYNC_DATABASE_URL=postgresql://vritti:vritti_password@timescaledb:5432/vritti_db
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      timescaledb:
        condition: service_healthy
  scheduler:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=timescaledb
    command: python -m src.ingestion.scheduler
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:

